[package]
name = "probe-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
probe-protocol = { path = "../protocol" }
probe-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.24"
ureq = "2"
sandbox-runtime = { git = "https://github.com/wangyedev/sandbox-runtime-rs" }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
steel-core = { version = "0.7", optional = true }
im-rc = { version = "15.1.0", optional = true }
pyo3 = { version = "0.25", optional = true, features = ["auto-initialize"] }
okm-python = { git = "https://github.com/orbsh/okm", default-features = false, optional = true }
wasmtime = { version = "34", optional = true }
ciborium = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["steel"]
steel = ["dep:steel-core", "dep:im-rc"]
python = ["dep:pyo3", "dep:okm-python"]
wasmtime = ["dep:wasmtime", "dep:ciborium", "dep:base64"]
nushell = []

[dev-dependencies]
tempfile = "3"
okm-core = { git = "https://github.com/orbsh/okm", default-features = false, features = ["test-engines"] }
okm-wire = { git = "https://github.com/orbsh/okm" }
base64 = "0.22"
